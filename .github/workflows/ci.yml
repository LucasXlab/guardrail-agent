name: CI
on:
  push:
    branches: [main, 'noah/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make dev
      - run: make check
      - run: make demo
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/guardrail-agent" --days 20 --agent chaotic --json audit.json --receipt-out receipt.json
          "$RUNNER_TEMP/wheel-env/bin/guardrail-agent" --verify audit.json --receipt receipt.json
